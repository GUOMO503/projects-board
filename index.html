<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>施工阶段看板 Construction Stage Board</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>施工阶段看板 Construction Stage Board</h1>
    <div class="toolbar">
      <select id="weekSelect" class="week-select"></select>
      <button id="newWeekBtn" class="btn" data-i18n="newWeek">新建本周 New Week</button>
      <button id="deleteWeekBtn" class="btn btn-danger" data-i18n="deleteWeek">删除本周 Delete</button>
      <button id="exportBtn" class="btn" data-i18n="export">导出本周 Export</button>
      <label id="importLabel" class="btn">
        <span data-i18n="import">导入本周 Import</span>
        <input type="file" id="importInput" accept="application/json" hidden />
      </label>
      <select id="langSelect" class="lang-select">
        <option value="bilingual">中 / EN</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <span id="serverStatus" class="server-status"></span>
    </div>
  </header>

  <main id="board" class="board"></main>

  <!-- 新建/编辑卡片对话框 -->
  <dialog id="cardDialog">
    <form id="cardForm" method="dialog">
      <h3 id="dialogTitle">新建项目卡片 New Card</h3>

      <label><span data-i18n="labelName">项目名称 Name</span>
        <input type="text" id="fieldName" required />
      </label>

      <label><span data-i18n="labelSummary">本周摘要 Weekly Update</span>
        <textarea id="fieldSummary" rows="3" data-i18n-ph="phSummary" placeholder="一句话描述本周进展 / Weekly progress note"></textarea>
      </label>

      <label><span data-i18n="labelLink">项目链接 Link（可选 optional）</span>
        <input type="url" id="fieldLink" placeholder="https://..." />
      </label>

      <label><span data-i18n="labelStage">所属阶段 Stage</span>
        <select id="fieldStage"></select>
      </label>

      <label><span data-i18n="labelPhotos">照片 Photos</span>
        <input type="file" id="fieldPhotos" accept="image/*" multiple />
      </label>
      <div id="photoPreview" class="photo-preview"></div>

      <div class="dialog-actions">
        <button type="button" id="deleteCardBtn" class="btn btn-danger" hidden data-i18n="deleteCard">删除卡片 Delete</button>
        <button type="button" id="cancelBtn" class="btn" data-i18n="cancel">取消 Cancel</button>
        <button type="submit" id="saveCardBtn" class="btn btn-primary" data-i18n="save">保存 Save</button>
      </div>
    </form>
  </dialog>

  <!-- 照片大图预览 -->
  <dialog id="photoDialog" class="photo-dialog">
    <img id="photoDialogImg" src="" alt="照片预览" />
  </dialog>

  <script src="app.js"></script>
</body>
</html>
